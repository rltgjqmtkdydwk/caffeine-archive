<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ece5d8">
<meta name="description" content="카공하기 좋은 곳, 느낌 좋은 곳. 지하철역 기준으로 모아 보는 카페 지도와 익명 후기.">
<title>카페인 아카이브</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <h1 class="logo">카페인<span>아카이브</span></h1>
  <div class="top-r">
    <button type="button" class="me" id="me" aria-label="로그인">로그인</button>
    <div class="mode">
      <button type="button" data-mode="type" class="on">종류</button>
      <button type="button" data-mode="station">역</button>
    </div>
  </div>
</header>

<nav class="chips" id="chips" aria-label="필터"></nav>

<div id="map"></div>

<button type="button" class="locate" id="locate" aria-label="내 위치">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="5"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5"/></svg>
</button>

<section class="sheet" id="sheet">
  <button type="button" class="handle" id="handle"><span></span><em id="count">불러오는 중</em></button>
  <ul class="list" id="list"></ul>
</section>

<article class="detail" id="detail" hidden></article>

<section class="panel" id="panel" role="dialog" aria-modal="true" hidden></section>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="reviews.js"></script>
<script src="app.js"></script>
</body>
</html>
